name: marquify-prod
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  db:
    logging: *logging
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: marquify
      POSTGRES_USER: marquify
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquify -d marquify"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    logging: *logging
    image: marquify-api:${RELEASE_TAG:?Defina RELEASE_TAG}
    build:
      context: ..
      dockerfile: ops/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres,prod
      DB_URL: jdbc:postgresql://db:5432/marquify
      DB_USERNAME: marquify
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?Defina PUBLIC_WEB_URL}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_WEB_URL:?Defina PUBLIC_WEB_URL}
      SERVICE_IMAGES_DIR: /app/data/service-images
      # API sees the proxy IP; per-client throttling is performed by nginx.
      API_LOGIN_RATE_LIMIT_MAX_ATTEMPTS: 300
    volumes:
      - images:/app/data/service-images
    ports:
      - "127.0.0.1:8080:8080"
  web:
    logging: *logging
    image: marquify-web:${RELEASE_TAG:?Defina RELEASE_TAG}
    build:
      context: ..
      dockerfile: ops/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8088:80"
volumes:
  database:
  images:
