limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 8m;
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @login_limit;
        proxy_pass http://api:8080/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location @login_limit {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"status":429,"codigo":"LIMITE_LOGIN","mensagem":"Muitas tentativas. Aguarde 60 segundos."}';
    }
    location /api/actuator/ { return 404; }
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / { try_files $uri $uri/ /index.html; }
}
