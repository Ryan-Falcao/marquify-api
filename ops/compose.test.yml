name: marquify-tests
services:
  postgres-test:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_USER: marquify_test
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: marquify_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquify_test -d marquify_test"]
      interval: 5s
      timeout: 5s
      retries: 20
