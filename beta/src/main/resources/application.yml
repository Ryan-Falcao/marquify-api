spring:
  application:
    name: marquify-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: true

api:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  security:
    token:
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:2h}

server:
  port: ${PORT:8080}
  servlet:
    session:
      # A API usa JWT stateless; não deve persistir sessões HTTP no disco.
      persistent: false
  error:
    include-message: never
    include-stacktrace: never
