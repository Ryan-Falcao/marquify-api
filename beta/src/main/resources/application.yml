spring:
  application:
    name: marquify-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: true

api:
  public-web-url: ${PUBLIC_WEB_URL:http://localhost:5173}
  storage:
    service-images: ${SERVICE_IMAGES_DIR:./data/service-images}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  security:
    token:
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:2h}

payments:
  mercado-pago:
    access-token: ${MERCADO_PAGO_ACCESS_TOKEN:}
    webhook-secret: ${MERCADO_PAGO_WEBHOOK_SECRET:}
    valor-profissional: ${MERCADO_PAGO_PROFESSIONAL_PRICE:}

server:
  shutdown: graceful
  port: ${PORT:8080}
  servlet:
    session:
      # A API usa JWT stateless; não deve persistir sessões HTTP no disco.
      persistent: false
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
