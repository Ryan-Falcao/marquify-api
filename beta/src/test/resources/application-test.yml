# Banco descartável PostgreSQL iniciado pelo Testcontainers durante os testes.
spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///marquify_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test
  flyway:
    locations: classpath:db/migration/postgresql
    sql-migration-suffixes: .pgsql

api:
  login-rate-limit:
    max-attempts: 10000
  security:
    token:
      secret: marquify-test-only-key-never-use-in-production
      expiration: 5m
